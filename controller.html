<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tetris-Duell – Controller</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 3 2%27%3E%3Cpath fill=%27%23a855f7%27 d=%27M0 1h3v1H0zM1 0h1v1H1z%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/controller.css">
</head>
<body>
  <!-- Beitreten -->
  <section id="join" class="screen">
    <h1>TETRIS <span>DUELL</span></h1>
    <label>Dein Name
      <input id="name" maxlength="16" autocomplete="off" placeholder="z. B. Mia">
    </label>
    <label id="codeLabel">Raum-Code (steht am Beamer)
      <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE">
    </label>
    <button id="btnJoin">Mitspielen</button>
    <p id="joinMsg" class="msg"></p>
  </section>

  <!-- Gamepad -->
  <section id="pad" class="screen" hidden>
    <header id="bar">
      <div class="who"><span id="pdot"></span><b id="pname">…</b></div>
      <div id="info">Verbinde …</div>
    </header>
    <div id="status" class="status"></div>
    <div class="controls">
      <div class="cluster left">
        <button class="btn" data-a="left" aria-label="Links">◀</button>
        <button class="btn" data-a="right" aria-label="Rechts">▶</button>
        <button class="btn wide soft" data-a="down" aria-label="Schneller">▼<small>schneller</small></button>
      </div>
      <div class="cluster right">
        <button class="btn small" data-a="hold" aria-label="Halten">⇄<small>halten</small></button>
        <button class="btn small" data-a="ccw" aria-label="Gegen den Uhrzeigersinn drehen">↺</button>
        <button class="btn wide rot" data-a="cw" aria-label="Drehen">↻<small>drehen</small></button>
        <button class="btn wide drop" data-a="drop" aria-label="Fallen lassen">⤓<small>fallen lassen</small></button>
      </div>
    </div>
  </section>

  <script src="vendor/peerjs.min.js"></script>
  <script src="js/controller.js"></script>
</body>
</html>
