<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>KBS Tetris – Mitspielen</title>
  <link rel="icon" type="image/png" href="img/kbs-logo.png">
  <link rel="stylesheet" href="css/controller.css">
</head>
<body>
  <!-- Beitreten -->
  <section id="join" class="screen">
    <img class="badge" src="img/kbs-logo.png" alt="Logo der KBS">
    <h1><small>KBS</small>TETRIS</h1>
    <label>Dein Name
      <input id="name" maxlength="16" autocomplete="off" placeholder="z. B. Mia">
    </label>
    <label id="codeLabel">Raum-Code (steht am Beamer)
      <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE">
    </label>
    <button id="btnJoin">Mitspielen</button>
    <p id="joinMsg" class="msg"></p>
  </section>

  <!-- Spiel / Gamepad -->
  <section id="pad" class="screen" hidden>
    <header id="bar">
      <div class="who"><span id="pdot"></span><b id="pname">…</b></div>
      <div id="info"></div>
    </header>
    <div id="stage">
      <canvas id="field" hidden></canvas>
      <div id="status" class="status"></div>
    </div>
    <div class="controls" id="controls" hidden>
      <button class="btn" data-a="left" aria-label="Links">◀</button>
      <button class="btn rot" data-a="cw" aria-label="Drehen">↻</button>
      <button class="btn" data-a="right" aria-label="Rechts">▶</button>
    </div>
  </section>

  <script src="js/tetris.js"></script>
  <script src="js/render.js"></script>
  <script src="js/net.js"></script>
  <script src="js/controller.js"></script>
</body>
</html>
